<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Device-Hub</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; }
        td, th { padding: .4rem .8rem; border-bottom: 1px solid #ddd; text-align: left; }
        .online { color: green; } .offline { color: #999; }
    </style>
</head>
<body>
<h1>Geräte</h1>
<table>
    <thead><tr><th>Gerät</th><th>Status</th><th>Messwert</th><th>Zeit</th><th>Intervall</th><th></th></tr></thead>
    <tbody id="devices"></tbody>
</table>

<script>
    const devices = new Map();

    // Werte von den Geräten kommen nur über textContent ins DOM,
    // nie über innerHTML. So kann eine manipulierte ID kein HTML/Skript einschleusen.
    function cell(text, className) {
        const td = document.createElement('td');
        td.textContent = text;
        if (className) td.className = className;
        return td;
    }

    function render() {
        const rows = [...devices.values()]
            .sort((a, b) => a.deviceId.localeCompare(b.deviceId))
            .map(d => {
                const m = d.lastMeasurement;
                const tr = document.createElement('tr');
                tr.append(
                    cell(d.deviceId),
                    cell(d.online ? 'online' : 'offline', d.online ? 'online' : 'offline'),
                    cell(m ? m.value.toFixed(2) : '–'),
                    cell(m ? new Date(m.timestamp).toLocaleTimeString() : '–'),
                    cell(d.intervalMs != null ? `${d.intervalMs} ms` : '–')
                );

                const button = document.createElement('button');
                button.textContent = 'Intervall ändern';
                button.disabled = !d.online;
                button.addEventListener('click', () => changeInterval(d.deviceId));
                const actionCell = document.createElement('td');
                actionCell.append(button);
                tr.append(actionCell);
                return tr;
            });
        document.getElementById('devices').replaceChildren(...rows);
    }

    async function changeInterval(id) {
        const ms = Number(prompt('Neues Intervall in ms:', '1000'));
        if (!ms) return;
        const res = await fetch(`/devices/${encodeURIComponent(id)}/commands/set-interval`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ intervalMs: ms })
        });
        if (!res.ok) alert(`Fehler: ${res.status}`);
    }

    async function init() {
        const list = await (await fetch('/devices')).json();
        list.forEach(d => devices.set(d.deviceId, d));
        render();

        const source = new EventSource('/devices/stream');
        source.addEventListener('device', e => {
            const d = JSON.parse(e.data);
            devices.set(d.deviceId, d);
            render();
        });
    }

    init();
</script>
</body>
</html>
